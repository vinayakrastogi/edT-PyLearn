<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyLearn Run API demo</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#fffbe6}
h1{margin-bottom:.2rem;display:flex;align-items:center;gap:.6rem}textarea,pre,input{width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:14px;border:3px solid #000;padding:.6rem;background:#fff}
textarea{height:200px}button{margin:.6rem 0;padding:.6rem 1.4rem;font-weight:700;border:3px solid #000;background:#ffd23f;cursor:pointer;box-shadow:3px 3px 0 #000;display:inline-flex;align-items:center;gap:.4rem}
pre{min-height:60px;white-space:pre-wrap}.err{color:#c00}small{color:#555}img{max-width:100%;border:3px solid #000;margin-top:.5rem}
</style></head><body>
<h1><svg class="logo" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
  <rect x="5" y="5" width="41" height="41" rx="8" fill="#1A1A1A"/>
  <rect x="2" y="2" width="41" height="41" rx="8" fill="#FFE135" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="22.5" cy="24" rx="14" ry="12.5" fill="#00C875" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="22.5" cy="28.5" rx="9" ry="6" fill="#B8F5D5" opacity="0.6"/>
  <circle cx="17.5" cy="21" r="2.6" fill="#1A1A1A"/><circle cx="27.5" cy="21" r="2.6" fill="#1A1A1A"/>
  <circle cx="18.3" cy="20.2" r="0.9" fill="#FFF"/><circle cx="28.3" cy="20.2" r="0.9" fill="#FFF"/>
  <path d="M 17.5 27.5 Q 22.5 32 27.5 27.5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 22.5 30 l 0 4 M 22.5 34 l -1.6 1.6 M 22.5 34 l 1.6 1.6" stroke="#FF4D6D" stroke-width="1.6" stroke-linecap="round"/>
</svg>PyLearn Run API</h1>
<small>A client page calling <code>POST /api/public/run</code> with an API key.</small>
<p><label>API URL<input id="url"></label></p>
<p><label>API key<input id="key" value="pylearn-demo"></label></p>
<textarea id="code">import math
for n in range(1, 6):
    print(n, math.factorial(n))</textarea>
<button id="run"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>Run</button>
<pre id="out"></pre><div id="imgs"></div>
<script>
document.getElementById('url').value = location.origin + '/api/public/run'
document.getElementById('run').onclick = async () => {
  const out = document.getElementById('out'), imgs = document.getElementById('imgs')
  out.textContent = 'Running...'; out.className = ''; imgs.innerHTML = ''
  try {
    const r = await fetch(document.getElementById('url').value, {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-API-Key': document.getElementById('key').value},
      body: JSON.stringify({code: document.getElementById('code').value})})
    const d = await r.json()
    if (!r.ok) { out.textContent = d.detail; out.className = 'err'; return }
    out.textContent = d.stdout + (d.stderr ? '\n' + d.stderr : '') + (d.timed_out ? '\n[timed out]' : '')
    if (d.stderr) out.className = 'err'
    ;(d.images || []).forEach(b => { const i = new Image(); i.src = b.startsWith('data:') ? b : 'data:image/png;base64,' + b; imgs.appendChild(i) })
  } catch (e) { out.textContent = String(e); out.className = 'err' }
}
</script></body></html>
